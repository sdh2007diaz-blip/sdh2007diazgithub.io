<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operación Rescate Sulem 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#ffe4f2,#f5add2);color:#61163f;min-height:100vh;overflow-x:hidden}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative}
.card{width:min(520px,100%);background:#fffafd;border:2px solid #fff;border-radius:30px;padding:28px 22px;text-align:center;box-shadow:0 18px 45px #7b285333;position:relative;z-index:2}
h1{color:#b51768;font-size:27px;margin:0 0 18px}
h2{color:#71184e;font-size:22px}
p{font-size:17px;line-height:1.55}
.btn{border:0;border-radius:30px;padding:15px 22px;background:#d72a85;color:white;font-weight:bold;font-size:16px;margin:12px 4px;cursor:pointer;box-shadow:0 7px 15px #d72a8538}
.input{width:100%;padding:14px;border:2px solid #e9afd0;border-radius:15px;font-size:16px;outline:none}
.options{display:grid;gap:10px}
.option{padding:14px;border:2px solid #e8afd0;border-radius:15px;background:#fff3f9;text-align:left;cursor:pointer}
.selected{background:#ffdceb;border-color:#d72a85}
.feedback{margin-top:15px;font-weight:bold}
.key{font-size:42px;animation:pop .5s ease}
.secret{font-size:25px;font-weight:bold;letter-spacing:5px;color:#c41b72;margin:15px}
.letters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.letter{width:45px;height:45px;border:2px solid #e8afd0;border-radius:12px;background:white;font-weight:bold;font-size:20px;color:#71184e;cursor:pointer}
.rose{display:flex;justify-content:center;flex-wrap:wrap;max-width:280px;margin:15px auto}
.rose span{font-size:38px;opacity:0;transform:translateY(30px) scale(.7);animation:roseIn .7s forwards}
.heart{position:fixed;bottom:-30px;animation:float 7s linear infinite;opacity:.6;z-index:1;pointer-events:none}
.biglove{font-size:30px;font-weight:900;color:#c71973}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes roseIn{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes float{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}

.hero-photo{width:210px;height:210px;object-fit:cover;border-radius:50%;display:block;margin:18px auto;border:8px solid #fff;box-shadow:0 8px 25px #8b275533}
.bouquet-wrap{display:flex;justify-content:center;margin:18px auto 10px;animation:bouquetIn 1.2s ease both}
.bouquet{width:min(300px,90%);max-height:390px;object-fit:contain;filter:drop-shadow(0 12px 15px #7b285333)}
@keyframes bouquetIn{from{opacity:0;transform:translateY(35px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<div id="app"></div>

const app=document.querySelector('#app');
let letters=[];

function floatingHearts(){
  for(let i=0;i<18;i++){
    const h=document.createElement('span');
    h.className='heart';
    h.textContent=Math.random()>.3?'💕':'❤️';
    h.style.left=Math.random()*100+'%';
    h.style.animationDelay=(Math.random()*7)+'s';
    h.style.fontSize=(14+Math.random()*14)+'px';
    document.body.appendChild(h);
  }
}
floatingHearts();

function secret(){
letters=[];
app.innerHTML=`

    ${['E','M','T','O','A'].map(x=>`<button class="letter" onclick="addLetter('${x}')">${x}</button>`).join('')}

  <p>Coloca las letras en el orden correcto para descubrir el mensaje.</p>
  <div id="secretResult"></div>
</div></main>`;
}

function addLetter(x){
letters.push(x);
document.querySelector('#secretResult').innerHTML=`<div class="secret">${letters.join(' ')}</div>`;
if(letters.join('')==='TEAMO'){
setTimeout(secretDone,500);
}else if(letters.length===5){
letters=[];
document.querySelector('#secretResult').innerHTML='<div class="feedback">🔄 No es el orden correcto. Inténtalo de nuevo. 💗</div>';
}
}
